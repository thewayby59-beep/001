  function toJpeg(file, max) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var k = Math.min(1, max / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var x = c.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
        x.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("Bu rasmni ochib bo'lmadi")); };
      img.src = url;
    });
  }

  // ---------- Yashirin kirish: pastdagi 001 ni 5 marta bosish, keyin parol ----------
  function toHex(buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }
  function derive(pw, salt) {
    var s = window.crypto && window.crypto.subtle;
    if (!s) return Promise.reject(new Error('nocrypto'));
    var enc = new TextEncoder();
    return s.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']).then(function (k) {
      return s.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 150000, hash: 'SHA-256' }, k, 256);
    }).then(toHex);
  }
  function newSalt() { var a = new Uint8Array(16); window.crypto.getRandomValues(a); return toHex(a); }

  var taps = 0, tapTimer, lockUntil = 0, wrong = 0;
  $('#secret').addEventListener('click', function () {

    if (taps >= 5) { taps = 0; showGate(); }

  function showGate() {
    var setup = !state.ph;
    $('#gtitle').textContent = setup ? "Parol o'rnatish" : 'Admin';
    $('#gtext').textContent = setup ? "Admin uchun parol o'ylab toping (kamida 8 belgi). Keyin «E'lon qilish» ni bosing." : 'Parolni kiriting';
    $('#gok').textContent = setup ? "O'rnatish" : 'Kirish';
    $('#gpw').value = '';
    $('#gate').hidden = false;
    $('#gpw').focus();
  }
  function hideGate() { $('#gate').hidden = true; $('#gpw').value = ''; }
  $('#gcancel').addEventListener('click', hideGate);
  $('#gform').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = $('#gpw').value;
    if (!state.ph) {
      if (pw.length < 8) return toast("Parol kamida 8 belgi bo'lsin", true);
      var salt;
      try { salt = newSalt(); } catch (err) { return toast("Bu brauzerda parol o'rnatib bo'lmaydi", true); }
      derive(pw, salt).then(function (h) {
        state.ps = salt; state.ph = h;
        hideGate(); openAdmin(true);
        dirty = true;
        $('#publish').disabled = false;
        $('#astatus').textContent = "Parol hali e'lon qilinmagan";
      }).catch(function () { toast("Bu brauzerda parol o'rnatib bo'lmaydi", true); });
      return;
    }
    if (Date.now() < lockUntil) return toast('Biroz kuting va qayta urining', true);
    derive(pw, state.ps).then(function (h) {
      if (h === state.ph) { wrong = 0; hideGate(); openAdmin(true); }
      else {
        wrong++;
        if (wrong >= 5) { lockUntil = Date.now() + 30000; wrong = 0; }
        toast("Parol noto'g'ri", true);
      }
    }).catch(function () { toast("Bu brauzerda kirib bo'lmaydi", true); });
  });
  $('#setPw').addEventListener('click', function () {
    var pw = $('#fNewPw').value;
    if (pw.length < 8) return toast("Parol kamida 8 belgi bo'lsin", true);
    var salt;
    try { salt = newSalt(); } catch (err) { return toast('Bu brauzerda ishlamaydi', true); }
    derive(pw, salt).then(function (h) {
      state.ps = salt; state.ph = h;
      $('#fNewPw').value = '';
      dirty = true;
      $('#publish').disabled = false;
      $('#astatus').textContent = "Yangi parol hali e'lon qilinmagan";
      toast("Parol o'zgardi. «E'lon qilish» ni bosing");
    }).catch(function () { toast('Bu brauzerda ishlamaydi', true); });
  });
  $('#closeAdmin').addEventListener('click', function () { openAdmin(false); });

  // ---------- E'lon qilish ----------
  function buildDoc() {
    var headStyle = document.head && document.head.querySelector('style');
    var reset = headStyle && /safe-area-inset/.test(headStyle.textContent) ? headStyle.textContent : FALLBACK_RESET;
    var css = $('#css').textContent;
    var shell = $('#shell').innerHTML;
    var data = JSON.stringify(state).replace(/</g, '\\u003c');
    var app = $('#app').textContent;
    var close = '<' + '/';
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + close + 'style>' + close + 'head><body>' +
      "<title>001 Do'kon" + close + 'title><style id="css">' + css + close + 'style>' +
      '<div id="root">' + close + 'div><template id="shell">' + shell + close + 'template>' +
      '<script type="application/json" id="data">' + data + close + 'script>' +
      '<script id="app">' + app + close + 'script>' + close + 'body>' + close + 'html>';
  }

  $('#publish').addEventListener('click', function () {
    var btn = this;
    if (!window.claude || !window.claude.use) return toast("Saqlash faqat do'kon egasi hisobida ishlaydi", true);
    btn.disabled = true;
    $('#astatus').textContent = "E'lon qilinmoqda...";
    window.claude.use('artifact').then(function (a) {
      if (!a) throw { code: 'not_granted' };
      try { sessionStorage.setItem('adm001', '1'); } catch (e) {}
      return a.publish(buildDoc());
    }).catch(function (err) {
      var code = err && err.code;
      btn.disabled = false;
      $('#astatus').textContent = "O'zgarishlar hali e'lon qilinmagan";
      if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'capability_disabled') toast("Faqat do'kon egasi o'zgartira oladi. O'z hisobingizdan oching", true);
      else if (code === 'too_large') toast("Hajm juda katta. Rasmlar sonini yoki o'lchamini kamaytiring", true);
      else if (code === 'conflict') toast("Sahifa yangilandi. Qayta urinib ko'ring", true);
      else if (code === 'rate_limited') toast("Juda tez-tez. Bir oz kutib qayta bosing", true);
      else toast("Saqlab bo'lmadi. Qayta urinib ko'ring", true);
    });
  });

  // ---------- Boshlash ----------
  applyLang(); renderFilters(); renderGrid(); renderCart();
  $('#lang').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-l]');
    if (!b) return;
    lang = b.getAttribute('data-l');
    try { localStorage.setItem('til_001', lang); } catch (er) {}
    applyLang(); renderFilters(); renderGrid(); renderCart();
  });
  function buildHalf() {
    var frag = document.createDocumentFragment();
    for (var i = 0; i < 8; i++) {
      frag.append(document.createTextNode('BRAND CLOTHES  '));
      var s = document.createElement('span');
      s.className = 'tw';
      s.textContent = '✦';
      s.style.animationDuration = (1 + Math.random() * 1.1).toFixed(2) + 's';
      s.style.animationDelay = '-' + (Math.random() * 2).toFixed(2) + 's';
      frag.append(s);
      frag.append(document.createTextNode('  '));
    }
    return frag;
  }
  $('#track').append(buildHalf(), buildHalf());
  try { if (sessionStorage.getItem('adm001') === '1') openAdmin(true); } catch (e) {}
})();
</script>

</body></html>
